name: Projekt aufnehmen

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: write
  issues: write

concurrency:
  group: verkaufsdaten
  cancel-in-progress: false

jobs:
  add:
    # Öffentliches Repo: nur Einträge von Berechtigten dürfen die Projektliste ändern.
    if: >
      contains(github.event.issue.labels.*.name, 'projekt') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Eintrag prüfen und aufnehmen
        id: add
        continue-on-error: true
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: node scripts/add-project.mjs

      - name: Daten neu einlesen
        if: steps.add.outputs.status == 'added'
        run: node scripts/scrape.mjs

      - name: Änderungen committen
        if: steps.add.outputs.status == 'added'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "data: Projekt aus #${{ github.event.issue.number }} aufgenommen"
          for i in 1 2 3 4; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "Push fehlgeschlagen, neuer Versuch in $((2**i))s"
            sleep $((2**i))
          done
          exit 1

      - name: Rückmeldung schreiben
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MESSAGE: ${{ steps.add.outputs.message }}
        run: |
          printf '%s\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_\n' \
            "${MESSAGE:-Der Eintrag konnte nicht verarbeitet werden.}" > comment.md
          gh issue comment "${{ github.event.issue.number }}" --body-file comment.md
          if [ "${{ steps.add.outputs.status }}" = "added" ] || [ "${{ steps.add.outputs.status }}" = "duplicate" ]; then
            gh issue close "${{ github.event.issue.number }}" --reason completed
          fi
