name: Projektliste pflegen

on:
  issues:
    types: [opened, edited, reopened, labeled]

permissions:
  contents: write
  issues: write

concurrency:
  group: verkaufsdaten
  cancel-in-progress: false

jobs:
  pflegen:
    # Öffentliches Repo: nur Einträge von Berechtigten dürfen die Projektliste ändern.
    if: contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # GitHub-Formulare vergeben nur Labels, die es im Repo schon gibt – fehlen sie,
      # bleibt der Eintrag unbeschriftet. Deshalb hier anlegen, falls nicht vorhanden.
      - name: Labels sicherstellen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create projekt           --color 0E8A16 --description "Projekt aufnehmen"      2>/dev/null || true
          gh label create projekt-entfernen --color B60205 --description "Projekt entfernen"      2>/dev/null || true
          gh label create parkierung        --color FBCA04 --description "Parkierung zuordnen"    2>/dev/null || true

      # Art des Eintrags aus dem Label ableiten – und ersatzweise aus dem Titel,
      # damit ein fehlendes Label den Eintrag nicht lautlos verschluckt.
      - name: Art des Eintrags bestimmen
        id: kind
        env:
          LABELS: ${{ join(github.event.issue.labels.*.name, ',') }}
          TITLE: ${{ github.event.issue.title }}
        run: |
          kind=""
          case ",$LABELS," in
            *,parkierung,*)        kind="parkierung" ;;
            *,projekt-entfernen,*) kind="entfernen" ;;
            *,projekt,*)           kind="hinzufuegen" ;;
          esac
          if [ -z "$kind" ]; then
            case "$TITLE" in
              *"Parkierung anpassen"*) kind="parkierung" ;;
              *"Projekt entfernen"*)   kind="entfernen" ;;
              *"Projekt hinzuf"*)      kind="hinzufuegen" ;;
            esac
          fi
          echo "Art: ${kind:-(kein Eintrag zur Projektliste – wird übersprungen)}"
          echo "kind=$kind" >> "$GITHUB_OUTPUT"

      - name: Eintrag verarbeiten
        id: run
        if: steps.kind.outputs.kind != ''
        continue-on-error: true
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          case "${{ steps.kind.outputs.kind }}" in
            parkierung)  node scripts/set-parking.mjs ;;
            entfernen)   node scripts/remove-project.mjs ;;
            hinzufuegen) node scripts/add-project.mjs ;;
          esac

      - name: Fehlende Koordinaten ergänzen
        if: contains(fromJSON('["added","removed","updated"]'), steps.run.outputs.status)
        run: node scripts/geocode.mjs

      - name: Daten neu einlesen
        if: contains(fromJSON('["added","removed","updated"]'), steps.run.outputs.status)
        run: node scripts/scrape.mjs

      - name: Änderungen committen
        if: contains(fromJSON('["added","removed","updated"]'), steps.run.outputs.status)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "data: Projektliste über #${{ github.event.issue.number }} angepasst"
          for i in 1 2 3 4; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "Push fehlgeschlagen, neuer Versuch in $((2**i))s"
            sleep $((2**i))
          done
          exit 1

      - name: Rückmeldung schreiben
        if: steps.kind.outputs.kind != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MESSAGE: ${{ steps.run.outputs.message }}
          STATUS: ${{ steps.run.outputs.status }}
        run: |
          printf '%s\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_\n' \
            "${MESSAGE:-Der Eintrag konnte nicht verarbeitet werden.}" > comment.md
          gh issue comment "${{ github.event.issue.number }}" --body-file comment.md
          case "$STATUS" in
            added|removed|updated|duplicate|unchanged) gh issue close "${{ github.event.issue.number }}" --reason completed ;;
          esac
