name: Projektliste pflegen

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: write
  issues: write

concurrency:
  group: verkaufsdaten
  cancel-in-progress: false

jobs:
  pflegen:
    # Öffentliches Repo: nur Einträge von Berechtigten dürfen die Projektliste ändern.
    if: >
      (contains(github.event.issue.labels.*.name, 'projekt') ||
       contains(github.event.issue.labels.*.name, 'projekt-entfernen')) &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Eintrag verarbeiten
        id: run
        continue-on-error: true
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ENTFERNEN: ${{ contains(github.event.issue.labels.*.name, 'projekt-entfernen') }}
        run: |
          if [ "$ENTFERNEN" = "true" ]; then
            node scripts/remove-project.mjs
          else
            node scripts/add-project.mjs
          fi

      - name: Daten neu einlesen
        if: steps.run.outputs.status == 'added' || steps.run.outputs.status == 'removed'
        run: node scripts/scrape.mjs

      - name: Änderungen committen
        if: steps.run.outputs.status == 'added' || steps.run.outputs.status == 'removed'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "data: Projektliste über #${{ github.event.issue.number }} angepasst"
          for i in 1 2 3 4; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "Push fehlgeschlagen, neuer Versuch in $((2**i))s"
            sleep $((2**i))
          done
          exit 1

      - name: Rückmeldung schreiben
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MESSAGE: ${{ steps.run.outputs.message }}
          STATUS: ${{ steps.run.outputs.status }}
        run: |
          printf '%s\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_\n' \
            "${MESSAGE:-Der Eintrag konnte nicht verarbeitet werden.}" > comment.md
          gh issue comment "${{ github.event.issue.number }}" --body-file comment.md
          case "$STATUS" in
            added|removed|duplicate) gh issue close "${{ github.event.issue.number }}" --reason completed ;;
          esac
